<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">KawaiiEmoji logging flow</title>
  <desc id="desc">Flow from Apache, MySQL, app, and API events into JSON log records, local files, shippers, Elasticsearch, Kibana, and Forward API.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #fbfcfe; }
      .title { font: 800 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 16px Arial, sans-serif; fill: #526071; }
      .box { rx: 14; stroke-width: 2; filter: url(#shadow); }
      .source { fill: #e7f0ff; stroke: #4078d7; }
      .file { fill: #fff7df; stroke: #d89500; }
      .shipper { fill: #e8fbff; stroke: #0891b2; }
      .store { fill: #ffe8ef; stroke: #e11d48; }
      .external { fill: #eef2f7; stroke: #64748b; }
      .head { font: 700 21px Arial, sans-serif; fill: #111827; }
      .text { font: 16px Arial, sans-serif; fill: #394150; }
      .small { font: 14px Arial, sans-serif; fill: #526071; }
      .line { fill: none; stroke: #374151; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow); }
      .json { fill: #f3e8ff; stroke: #8b5cf6; stroke-width: 2; rx: 12; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="620"/>
  <text x="56" y="62" class="title">Logimise andmevoog</text>
  <text x="56" y="92" class="subtitle">Komponentide sundmused teisendatakse JSON kirjeteks ja suunatakse lokaalsetesse ning kesksetesse logisusteemidesse.</text>

  <rect x="70" y="150" width="210" height="90" class="box source"/>
  <text x="105" y="188" class="head">Apache</text>
  <text x="105" y="218" class="text">access / error</text>

  <rect x="70" y="280" width="210" height="90" class="box source"/>
  <text x="105" y="318" class="head">MySQL</text>
  <text x="105" y="348" class="text">general query log</text>

  <rect x="70" y="410" width="210" height="90" class="box source"/>
  <text x="105" y="448" class="head">PHP app + API</text>
  <text x="105" y="478" class="text">rakenduse sundmused</text>

  <rect x="375" y="190" width="225" height="250" class="box file"/>
  <text x="410" y="232" class="head">Hosti logifailid</text>
  <text x="410" y="267" class="text">logs/apache_access.log</text>
  <text x="410" y="297" class="text">logs/apache_error.log</text>
  <text x="410" y="327" class="text">logs/mysql.log</text>
  <text x="410" y="372" class="small">Failid on mountitud konteineritesse.</text>

  <rect x="690" y="170" width="225" height="110" class="box shipper"/>
  <text x="725" y="212" class="head">Apache shipper</text>
  <text x="725" y="242" class="text">server-logs indeks</text>

  <rect x="690" y="340" width="225" height="110" class="box shipper"/>
  <text x="725" y="382" class="head">MySQL shipper</text>
  <text x="725" y="412" class="text">db-logs indeks</text>

  <rect x="1000" y="170" width="210" height="110" class="box store"/>
  <text x="1035" y="212" class="head">Elasticsearch</text>
  <text x="1035" y="242" class="text">port 9200</text>

  <rect x="1000" y="340" width="210" height="110" class="box store"/>
  <text x="1035" y="382" class="head">Kibana</text>
  <text x="1035" y="412" class="text">dashboard 5601</text>

  <rect x="690" y="505" width="520" height="65" class="box external"/>
  <text x="725" y="545" class="head">Forward API: https://srv1073565.hstgr.cloud:8443/api/v1/logs</text>

  <rect x="405" y="470" width="165" height="70" class="json"/>
  <text x="432" y="500" class="head">JSON</text>
  <text x="432" y="527" class="small">level, service, time</text>

  <path class="line" d="M 280 195 C 315 195 340 235 375 245"/>
  <path class="line" d="M 280 325 C 315 325 340 315 375 315"/>
  <path class="line" d="M 280 455 C 325 455 360 482 405 505"/>
  <path class="line" d="M 600 265 C 635 245 655 225 690 225"/>
  <path class="line" d="M 600 345 C 635 365 655 395 690 395"/>
  <path class="line" d="M 915 225 C 950 225 965 225 1000 225"/>
  <path class="line" d="M 915 395 C 950 345 965 275 1000 245"/>
  <path class="line" d="M 1105 280 C 1105 305 1105 315 1105 340"/>
  <path class="dash" d="M 915 225 C 950 390 930 505 945 505"/>
  <path class="dash" d="M 915 395 C 950 455 950 485 950 505"/>
</svg>
