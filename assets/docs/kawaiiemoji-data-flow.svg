<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">KawaiiEmoji application data flow</title>
  <desc id="desc">User request flow from browser to Apache PHP application, API endpoints, MySQL database, and response back to browser.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #fbfcfe; }
      .title { font: 800 34px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 16px Arial, sans-serif; fill: #526071; }
      .box { rx: 14; stroke-width: 2; filter: url(#shadow); }
      .browser { fill: #dff5ec; stroke: #25a36f; }
      .web { fill: #e7f0ff; stroke: #4078d7; }
      .api { fill: #f3e8ff; stroke: #8b5cf6; }
      .db { fill: #fff1d6; stroke: #d68b00; }
      .response { fill: #ffe8ef; stroke: #e11d48; }
      .head { font: 700 22px Arial, sans-serif; fill: #111827; }
      .text { font: 16px Arial, sans-serif; fill: #394150; }
      .small { font: 14px Arial, sans-serif; fill: #526071; }
      .line { fill: none; stroke: #374151; stroke-width: 3; marker-end: url(#arrow); }
      .return { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow); }
      .step { font: 700 15px Arial, sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="560"/>
  <text x="56" y="62" class="title">Rakenduse andmevoog</text>
  <text x="56" y="92" class="subtitle">Kasutaja tegevus liigub brauserist Apache/PHP rakenduseni, API kihti, MySQL andmebaasi ja tagasi vastuseks.</text>

  <rect x="70" y="200" width="190" height="110" class="box browser"/>
  <text x="105" y="242" class="head">Brauser</text>
  <text x="105" y="272" class="text">Kasutaja avab</text>
  <text x="105" y="300" class="text">veebirakenduse</text>

  <rect x="340" y="170" width="220" height="170" class="box web"/>
  <text x="375" y="212" class="head">Apache + PHP</text>
  <text x="375" y="244" class="text">app/index.php</text>
  <text x="375" y="272" class="text">login/register/upload</text>
  <text x="375" y="300" class="small">Teenindab HTML, CSS ja JS failid.</text>

  <rect x="645" y="170" width="230" height="170" class="box api"/>
  <text x="680" y="212" class="head">API otspunktid</text>
  <text x="680" y="244" class="text">auth, emojis, search</text>
  <text x="680" y="272" class="text">categories, tags, profile</text>
  <text x="680" y="300" class="small">Valideerib ja vormistab andmed.</text>

  <rect x="960" y="170" width="230" height="170" class="box db"/>
  <text x="995" y="212" class="head">MySQL</text>
  <text x="995" y="244" class="text">kawaiiemoji_db</text>
  <text x="995" y="272" class="text">users, emojis, likes</text>
  <text x="995" y="300" class="small">Salvestab rakenduse andmed.</text>

  <rect x="430" y="420" width="520" height="70" class="box response"/>
  <text x="465" y="462" class="head">Vastus kasutajale: galerii, otsingutulemus, profiil voi veateade</text>

  <path class="line" d="M 260 255 C 295 255 305 255 340 255"/>
  <text x="280" y="238" class="step">1 HTTP request</text>

  <path class="line" d="M 560 255 C 600 255 605 255 645 255"/>
  <text x="580" y="238" class="step">2 API call</text>

  <path class="line" d="M 875 255 C 915 255 920 255 960 255"/>
  <text x="895" y="238" class="step">3 SQL query</text>

  <path class="return" d="M 1075 340 C 1040 430 1010 455 950 455"/>
  <path class="return" d="M 430 455 C 320 455 190 375 165 310"/>
  <text x="905" y="410" class="step">4 data</text>
  <text x="230" y="430" class="step">5 HTML/JSON response</text>
</svg>
