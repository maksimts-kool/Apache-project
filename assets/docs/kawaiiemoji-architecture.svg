<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">KawaiiEmoji system architecture</title>
  <desc id="desc">Docker Compose architecture with browser, Apache PHP app, MySQL, log shippers, Elasticsearch, Kibana, and Forward API.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#394150"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#263144" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f7f8fb; }
      .zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .zone-title { font: 700 24px Arial, sans-serif; fill: #1f2937; }
      .box { stroke-width: 2; rx: 14; filter: url(#shadow); }
      .box-title { font: 700 21px Arial, sans-serif; fill: #111827; }
      .box-text { font: 16px Arial, sans-serif; fill: #394150; }
      .small { font: 14px Arial, sans-serif; fill: #526071; }
      .line { fill: none; stroke: #394150; stroke-width: 3; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrow); }
      .label { font: 700 15px Arial, sans-serif; fill: #334155; }
      .client { fill: #dff5ec; stroke: #25a36f; }
      .web { fill: #e7f0ff; stroke: #4078d7; }
      .db { fill: #fff1d6; stroke: #d68b00; }
      .log { fill: #f2e8ff; stroke: #8b5cf6; }
      .ship { fill: #e8fbff; stroke: #0891b2; }
      .viz { fill: #ffe8ef; stroke: #e11d48; }
      .external { fill: #eef2f7; stroke: #64748b; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="760"/>
  <text x="56" y="62" style="font: 800 34px Arial, sans-serif; fill: #111827;">KawaiiEmoji Docker Compose arhitektuur</text>
  <text x="56" y="92" class="small">Rakendus, andmebaas ja logide monitooring töötavad eraldi konteinerites uhes Docker vorgus.</text>

  <rect x="40" y="125" width="1200" height="565" class="zone"/>
  <text x="70" y="168" class="zone-title">Docker network: kawaii-net</text>

  <rect x="70" y="240" width="180" height="110" class="box client"/>
  <text x="100" y="282" class="box-title">Brauser</text>
  <text x="100" y="312" class="box-text">http://localhost</text>

  <rect x="330" y="205" width="235" height="170" class="box web"/>
  <text x="365" y="248" class="box-title">webserver</text>
  <text x="365" y="278" class="box-text">Apache + PHP</text>
  <text x="365" y="306" class="box-text">container: kawaii-webserver</text>
  <text x="365" y="334" class="box-text">port 80</text>

  <rect x="660" y="205" width="235" height="170" class="box db"/>
  <text x="695" y="248" class="box-title">db</text>
  <text x="695" y="278" class="box-text">MySQL 8.0</text>
  <text x="695" y="306" class="box-text">database: kawaiiemoji_db</text>
  <text x="695" y="334" class="box-text">volume: mysql_data</text>

  <rect x="330" y="455" width="235" height="95" class="box log"/>
  <text x="365" y="493" class="box-title">Apache logid</text>
  <text x="365" y="523" class="box-text">access.log / error.log</text>

  <rect x="660" y="455" width="235" height="95" class="box log"/>
  <text x="695" y="493" class="box-title">MySQL logid</text>
  <text x="695" y="523" class="box-text">logs/mysql.log</text>

  <rect x="970" y="210" width="210" height="95" class="box ship"/>
  <text x="1000" y="248" class="box-title">Log shippers</text>
  <text x="1000" y="278" class="box-text">Python scripts</text>

  <rect x="970" y="360" width="210" height="105" class="box viz"/>
  <text x="1000" y="400" class="box-title">Elasticsearch</text>
  <text x="1000" y="430" class="box-text">server/db/api logs</text>

  <rect x="970" y="535" width="210" height="95" class="box viz"/>
  <text x="1000" y="573" class="box-title">Kibana</text>
  <text x="1000" y="603" class="box-text">localhost:5601</text>

  <rect x="535" y="610" width="245" height="70" class="box external"/>
  <text x="570" y="652" class="box-title">Forward API HTTPS</text>

  <path class="line" d="M 250 295 C 280 295 300 290 330 290"/>
  <text x="265" y="275" class="label">HTTP</text>

  <path class="line" d="M 565 290 C 605 290 620 290 660 290"/>
  <text x="585" y="270" class="label">SQL</text>

  <path class="line" d="M 448 375 C 448 405 448 425 448 455"/>
  <path class="line" d="M 778 375 C 778 405 778 425 778 455"/>

  <path class="line" d="M 565 503 C 720 503 820 258 970 258"/>
  <path class="line" d="M 895 503 C 935 503 930 258 970 258"/>
  <path class="line" d="M 1075 305 C 1075 325 1075 340 1075 360"/>
  <path class="line" d="M 1075 465 C 1075 495 1075 505 1075 535"/>
  <path class="dash" d="M 970 430 C 870 500 790 615 780 645"/>
</svg>
