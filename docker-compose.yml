services:
  webserver:
    build: ./webserver
    container_name: kawaii-webserver
    ports:
      - "80:80"
    volumes:
      - ./app:/var/www/html
      - ./logs/apache_access.log:/var/log/apache2/access.log
      - ./logs/apache_error.log:/var/log/apache2/error.log
    networks:
      - kawaii-net
    restart: unless-stopped
    # depends_on:
    #   - db
    # Uncomment depends_on once the db service is added by Timur

  # db:
  #   Service will be added by DB Admin (Timur)
  #   image: mysql:8.0 or mariadb:10
  #   container_name: kawaii-db
  #   environment:
  #     MYSQL_ROOT_PASSWORD: ...
  #     MYSQL_DATABASE: kawaiiemoji_db
  #     MYSQL_USER: ...
  #     MYSQL_PASSWORD: ...
  #   volumes:
  #     - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
  #     - ./logs/mysql.log:/var/log/mysql/mysql.log
  #   networks:
  #     - kawaii-net

networks:
  kawaii-net:
    driver: bridge
