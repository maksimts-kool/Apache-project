services:
  webserver:
    build: ./webserver
    container_name: kawaii-webserver
    ports:
      - "80:80"
    volumes:
      - ./app:/var/www/html
      - ./logs/apache_access.log:/var/log/apache2/access.log
      - ./logs/apache_error.log:/var/log/apache2/error.log
    networks:
      - kawaii-net
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: kawaii-db
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: kawaiiemoji_db
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./logs/mysql.log:/var/log/mysql/mysql.log
    networks:
      - kawaii-net
    command: --general-log=1 --general-log-file=/var/log/mysql/mysql.log
    restart: unless-stopped

networks:
  kawaii-net:
    driver: bridge
